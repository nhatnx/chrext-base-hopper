<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>BaseHopper Dashboard</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #0c0c0c;
      --bg2: #131313;
      --bg3: #1a1a1a;
      --bg4: #242424;
      --border: #242424;
      --border2: #333;
      --green: #3ecf8e;
      --amber: #f59e0b;
      --blue: #60a5fa;
      --red: #f87171;
      --text: #f0f0f0;
      --muted: #777;
      --dim: #4a4a4a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    .mono {
      font-family: ui-monospace, 'Cascadia Code', Consolas, monospace
    }

    /* Header */
    .hdr {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }

    .hdr-logo {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: var(--bg3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0
    }

    .hdr h1 {
      font-size: 17px;
      font-weight: 600
    }

    .hdr-sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 1px
    }

    .hdr-actions {
      margin-left: auto;
      display: flex;
      gap: 8px
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 15px;
      border-radius: 8px;
      border: 1px solid var(--border2);
      background: var(--bg2);
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .14s;
      font-family: inherit;
    }

    .btn:hover {
      background: var(--bg3);
      border-color: #444
    }

    .btn.primary {
      background: var(--green);
      border-color: var(--green);
      color: #071a0f;
      font-weight: 600
    }

    .btn.primary:hover {
      background: #4edfa0
    }

    .btn.warn {
      background: var(--amber);
      border-color: var(--amber);
      color: #2d1d05;
      font-weight: 600
    }

    .btn.warn:hover {
      background: #fbb033
    }

    .btn.sm {
      padding: 5px 11px;
      font-size: 12px;
      border-radius: 6px
    }

    .btn.icon {
      padding: 5px 7px;
      border-radius: 6px;
      color: var(--muted)
    }

    .btn.icon:hover {
      color: var(--text)
    }

    .btn .spin {
      animation: spin .7s linear infinite
    }

    .btn:disabled {
      opacity: .45;
      pointer-events: none
    }

    .btn svg {
      flex-shrink: 0
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 8px;
      padding: 16px 32px;
      border-bottom: 1px solid #1a1a1a;
      flex-wrap: wrap
    }

    .pill {
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 12.5px;
      border: 1px solid var(--border2);
      color: var(--muted);
      cursor: pointer;
      transition: all .13s;
      background: transparent;
      font-family: inherit;
    }

    .pill:hover {
      color: var(--text);
      border-color: #444
    }

    .pill.active {
      background: #1e2a24;
      border-color: #3ecf8e55;
      color: var(--green)
    }

    .pill .count {
      opacity: .7
    }

    /* Main */
    .main {
      padding: 24px 32px 60px;
      max-width: 1280px;
      margin: 0 auto
    }

    /* Account section */
    .acct {
      margin-bottom: 32px
    }

    .acct-hdr {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 12px
    }

    .acct-avatar {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
      border: 1px solid;
    }

    .acct-name {
      font-size: 14.5px;
      font-weight: 600
    }

    .acct-email {
      font-size: 12px;
      color: var(--muted)
    }

    .acct-status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px
    }

    .acct-status .link {
      background: none;
      border: none;
      font: inherit;
      color: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
      padding: 0
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%
    }

    /* Project grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px
    }

    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px 17px;
      transition: border-color .15s;
    }

    .card:hover {
      border-color: var(--border2)
    }

    .card.paused {
      border-color: #f59e0b55
    }

    .card.paused:hover {
      border-color: #f59e0b88
    }

    .card.inactive {
      opacity: .55
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
      gap: 8px
    }

    .card-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .badge {
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      border: 1px solid;
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: .2px;
    }

    .badge.active {
      background: #12281c;
      color: var(--green);
      border-color: #3ecf8e44
    }

    .badge.paused {
      background: #2d2110;
      color: var(--amber);
      border-color: #f59e0b44
    }

    .badge.inactive {
      background: #222;
      color: #888;
      border-color: #333
    }

    .badge.pending {
      background: #1a2333;
      color: var(--blue);
      border-color: #60a5fa44
    }

    .card-meta {
      font-size: 11.5px;
      color: var(--muted);
      margin-bottom: 12px;
      line-height: 1.5
    }

    .card-meta .warn-text {
      color: var(--amber)
    }

    .card-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap
    }

    /* Token setup panel */
    .token-panel {
      background: var(--bg2);
      border: 1px dashed var(--border2);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .token-panel p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6
    }

    .token-panel p a {
      color: var(--green);
      text-decoration: none
    }

    .token-panel p a:hover {
      text-decoration: underline
    }

    .token-row {
      display: flex;
      gap: 8px
    }

    .token-input {
      flex: 1;
      height: 36px;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      padding: 0 12px;
      outline: none;
      font-family: ui-monospace, monospace;
    }

    .token-input:focus {
      border-color: var(--green)
    }

    .token-input::placeholder {
      color: var(--dim);
      font-family: system-ui
    }

    /* Empty / loading */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted)
    }

    .empty h2 {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px
    }

    .empty p {
      font-size: 13px;
      line-height: 1.7
    }

    .note {
      font-size: 13px;
      color: var(--muted);
      padding: 8px 2px
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid var(--border2);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
      vertical-align: -4px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: all .2s;
      z-index: 99;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0)
    }

    .toast.ok {
      border-color: var(--green);
      color: var(--green)
    }

    .toast.err {
      border-color: var(--red);
      color: var(--red)
    }
  </style>
</head>

<body>

  <div class="hdr">
    <div class="hdr-logo">
      <img class="logo" src="../icons/icon48.png" alt="BaseHopper" />
    </div>
    <div>
      <h1>BaseHopper dashboard</h1>
      <div class="hdr-sub" id="hdr-sub">Loading accounts…</div>
    </div>
    <div class="hdr-actions">
      <button class="btn" id="btn-refresh">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 8a6 6 0 0 1 10.5-3.95" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          <path d="M14 8a6 6 0 0 1-10.5 3.95" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          <path d="M11 2.5l1.5 1.55-1.5 1.55" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M5 13.5l-1.5-1.55 1.5-1.55" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
        Refresh all
      </button>
      <button class="btn primary" id="btn-add" title="Log in to Supabase, then save the session from the popup">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        Add account
      </button>
    </div>
  </div>

  <div class="filters" id="filters">
    <button class="pill active" data-filter="all">All projects <span class="count" data-count="all"></span></button>
    <button class="pill" data-filter="active">Active <span class="count" data-count="active"></span></button>
    <button class="pill" data-filter="paused">Paused <span class="count" data-count="paused"></span></button>
    <button class="pill" data-filter="inactive">Inactive <span class="count" data-count="inactive"></span></button>
  </div>

  <div class="main" id="main">
    <div class="empty" id="loading-state">
      <span class="spinner"></span>
      <p style="margin-top:12px">Loading your accounts…</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="./dashboard.js"></script>
</body>

</html>
